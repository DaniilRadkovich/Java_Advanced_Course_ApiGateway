name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'tasks/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Build application and run tests
        env:
          MAVEN_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m"
        run: ./mvnw clean verify

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=DaniilRadkovich_Java_Advanced_Course_ApiGateway \
            -Dsonar.organization=daniilradkovich \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${SONAR_TOKEN}

      - name: Docker image artifact creation
        run: docker build -t apigateway:latest .

